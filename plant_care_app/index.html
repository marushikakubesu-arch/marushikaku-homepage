<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f7d4f">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<title>植物管理</title>
<style>
:root{--g:#2f7d4f;--gl:#e6f3ea;--bg:#f6f8f5;--tx:#222;--mu:#777;--bd:#dde3dc;--red:#c0392b;--bl:#2a7fb8}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,"Hiragino Sans","Yu Gothic",sans-serif;padding-bottom:76px}
header{background:var(--g);color:#fff;padding:14px 16px;position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:8px}
header h1{font-size:18px;margin:0;flex:1}
header button{background:rgba(255,255,255,.2);color:#fff;border:0;border-radius:8px;padding:6px 12px;font-size:15px}
main{padding:12px 14px}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--bd);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav button{flex:1;border:0;background:none;padding:10px 0 8px;font-size:11px;color:var(--mu)}
nav button span{display:block;font-size:20px}
nav button.on{color:var(--g);font-weight:700}
.card{background:#fff;border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:10px}
.row{display:flex;gap:10px;align-items:center}
.grow{flex:1;min-width:0}
.thumb{width:56px;height:56px;border-radius:10px;object-fit:cover;background:var(--gl);flex:none;display:flex;align-items:center;justify-content:center;font-size:26px}
.big{width:100%;max-height:260px;object-fit:cover;border-radius:12px;margin-bottom:10px}
h2{font-size:16px;margin:14px 0 8px}
.mu{color:var(--mu);font-size:13px}
.due{color:var(--red);font-weight:700}
.ok{color:var(--g)}
.btn{border:0;border-radius:10px;padding:10px 14px;font-size:15px;background:var(--g);color:#fff}
.btn.w{background:var(--bl)}
.btn.s{background:#fff;color:var(--g);border:1px solid var(--g)}
.btn.d{background:#fff;color:var(--red);border:1px solid var(--red)}
.btn.sm{padding:7px 10px;font-size:13px}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.fab{position:fixed;right:16px;bottom:88px;width:54px;height:54px;border-radius:50%;border:0;background:var(--g);color:#fff;font-size:30px;box-shadow:0 3px 10px rgba(0,0,0,.3);z-index:6}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:flex;align-items:flex-end}
.modal form{background:#fff;width:100%;max-height:90vh;overflow:auto;border-radius:16px 16px 0 0;padding:16px}
.modal label{display:block;font-size:13px;color:var(--mu);margin-top:10px}
.modal input,.modal select,.modal textarea{width:100%;font-size:16px;padding:9px;border:1px solid var(--bd);border-radius:8px;margin-top:3px;background:#fff}
.log{border-top:1px solid var(--bd);padding:8px 0;font-size:14px}
.log:first-child{border-top:0}
.tag{display:inline-block;background:var(--gl);color:var(--g);border-radius:6px;padding:1px 7px;font-size:12px;margin-right:4px}
.empty{text-align:center;color:var(--mu);padding:30px 10px}
</style>
</head>
<body>
<header><button id="back" hidden>‹ 戻る</button><h1 id="title">植物管理</h1><button id="edit" hidden>編集</button></header>
<main id="main"></main>
<button class="fab" id="fab" hidden>＋</button>
<nav id="nav">
<button data-tab="today"><span>📅</span>今日</button>
<button data-tab="plants"><span>🪴</span>植物</button>
<button data-tab="places"><span>📍</span>置き場所</button>
<button data-tab="settings"><span>⚙️</span>設定</button>
</nav>
<script>
"use strict";
// ---------- 保存（IndexedDBに全データを1件で保存） ----------
// 各データ(plants/places/logs)は更新日時 u(ms) を持つ。削除は S.del に {id,u} の印を残す（同期用）。
let S = {plants:[], places:[], logs:[], del:[]};
const dbReq = indexedDB.open("plant_care", 1);
dbReq.onupgradeneeded = () => dbReq.result.createObjectStore("kv");
function dbGet(){return new Promise(r=>{const q=dbReq.result.transaction("kv").objectStore("kv").get("state");q.onsuccess=()=>r(q.result);q.onerror=()=>r(null);});}
function saveLocal(){dbReq.result.transaction("kv","readwrite").objectStore("kv").put(S,"state");}
function save(){ saveLocal(); scheduleSync(); }
const now = () => Date.now();
const touch = o => { o.u = now(); return o; };
function tomb(ids){ const u = now(); ids.forEach(id => S.del.push({id, u})); }
function normalize(d){ d.del = d.del || []; ["plants","places","logs"].forEach(k => d[k].forEach(o => { if (typeof o.u !== "number") o.u = 0; })); return d; }

// ---------- ユーティリティ ----------
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const today = () => { const d = new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); };
const dayDiff = (a, b) => Math.round((new Date(a) - new Date(b)) / 864e5);
const plantById = id => S.plants.find(p => p.id === id);
const placeById = id => S.places.find(p => p.id === id);
const logsOf = (f) => S.logs.filter(f).sort((a,b) => b.date.localeCompare(a.date) || b.id.localeCompare(a.id));
const TYPE = {water:"💧水やり", fert:"🧪肥料", growth:"🌱成長", lux:"☀️LUX", air:"🌀空気循環"};

function resizePhoto(file){
  return new Promise(res => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const m = 900, k = Math.min(1, m / Math.max(img.width, img.height));
      const c = document.createElement("canvas"); c.width = img.width*k; c.height = img.height*k;
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url); res(c.toDataURL("image/jpeg", .8));
    };
    img.onerror = () => res(null);
    img.src = url;
  });
}

// フォーム：fields = [{n,l,t:'text'|'number'|'date'|'select'|'textarea'|'photo',v,o:[[値,表示]]}]
function openForm(title, fields, onOk){
  const m = document.createElement("div"); m.className = "modal";
  m.innerHTML = `<form><h2 style="margin-top:0">${esc(title)}</h2>` + fields.map(f => {
    const v = esc(f.v ?? "");
    let inp;
    if (f.t === "select") inp = `<select name="${f.n}">` + f.o.map(([val,lab]) => `<option value="${esc(val)}" ${val===f.v?"selected":""}>${esc(lab)}</option>`).join("") + `</select>`;
    else if (f.t === "textarea") inp = `<textarea name="${f.n}" rows="3">${v}</textarea>`;
    else if (f.t === "photo") inp = `<input type="file" name="${f.n}" accept="image/*">`;
    else inp = `<input name="${f.n}" type="${f.t||"text"}" value="${v}" ${f.t==="number"?'step="any" inputmode="decimal"':""}>`;
    return `<label>${esc(f.l)}${inp}</label>`;
  }).join("") + `<div class="btns"><button class="btn grow">保存</button><button type="button" class="btn s" data-x>キャンセル</button></div></form>`;
  document.body.appendChild(m);
  m.querySelector("[data-x]").onclick = () => m.remove();
  m.onclick = e => { if (e.target === m) m.remove(); };
  m.querySelector("form").onsubmit = async e => {
    e.preventDefault();
    const out = {};
    for (const f of fields) {
      const el = e.target.elements[f.n];
      out[f.n] = f.t === "photo" ? (el.files[0] ? await resizePhoto(el.files[0]) : null) : el.value.trim();
    }
    m.remove(); onOk(out); save(); render();
  };
}

// ---------- 状態 ----------
let tab = "today", view = null; // view: {k:'plant'|'place', id}
const lastLog = (pid, type) => logsOf(l => l.plantId === pid && l.type === type)[0];
function dueInfo(p, type){
  const days = +p[type === "water" ? "waterDays" : "fertDays"];
  if (!days) return null;
  const l = lastLog(p.id, type);
  if (!l) return {late: 0, text: "記録なし", due: true, days};
  const late = dayDiff(today(), l.date) - days;
  return {late, due: late >= 0, text: late > 0 ? `${late}日超過` : late === 0 ? "今日" : `あと${-late}日`, days};
}
function thumb(p){return p.photo ? `<img class="thumb" src="${p.photo}">` : `<div class="thumb">🪴</div>`;}

// ---------- 画面 ----------
function render(){
  const main = $("#main"), back = $("#back"), edit = $("#edit"), fab = $("#fab");
  document.querySelectorAll("nav button").forEach(b => b.classList.toggle("on", b.dataset.tab === tab && !view));
  back.hidden = edit.hidden = !view; fab.hidden = !!view || !["plants","places"].includes(tab);
  if (view?.k === "plant") return renderPlant(main);
  if (view?.k === "place") return renderPlace(main);
  $("#title").textContent = {today:"今日のお世話", plants:"植物", places:"置き場所", settings:"設定"}[tab];
  if (tab === "today") {
    const items = [];
    S.plants.forEach(p => ["water","fert"].forEach(t => { const d = dueInfo(p, t); if (d?.due) items.push({p,t,d}); }));
    items.sort((a,b) => b.d.late - a.d.late);
    main.innerHTML = items.length ? items.map(({p,t,d}) => `<div class="card row">${thumb(p)}<div class="grow"><b>${esc(p.name)}</b><div class="mu">${TYPE[t]}　<span class="due">${d.text}</span></div></div><button class="btn sm ${t==="water"?"w":""}" data-act="done" data-id="${p.id}" data-t="${t}">済</button></div>`).join("")
      : `<div class="empty">${S.plants.length ? "今日やることはありません 🎉" : "「植物」タブから植物を登録しましょう"}</div>`;
  } else if (tab === "plants") {
    main.innerHTML = S.plants.length ? S.plants.map(p => {
      const w = dueInfo(p,"water"), f = dueInfo(p,"fert"), pl = placeById(p.placeId);
      return `<div class="card row" data-act="plant" data-id="${p.id}">${thumb(p)}<div class="grow"><b>${esc(p.name)}</b> <span class="mu">${esc(p.species)}</span><div class="mu">${pl ? "📍"+esc(pl.name) : "場所未設定"}</div><div class="mu">${w?`💧<span class="${w.due?"due":"ok"}">${w.text}</span> `:""}${f?`🧪<span class="${f.due?"due":"ok"}">${f.text}</span>`:""}</div></div></div>`;
    }).join("") : `<div class="empty">右下の＋で植物を登録</div>`;
  } else if (tab === "places") {
    main.innerHTML = S.places.length ? S.places.map(pl => {
      const n = S.plants.filter(p => p.placeId === pl.id).length, lx = logsOf(l => l.placeId === pl.id && l.type === "lux")[0], ar = logsOf(l => l.placeId === pl.id && l.type === "air")[0];
      return `<div class="card" data-act="place" data-id="${pl.id}"><b>📍${esc(pl.name)}</b> <span class="mu">${n}鉢</span><div class="mu">☀️${lx ? lx.value+" lux ("+lx.date+")" : "LUX未記録"}</div><div class="mu">🌀${ar ? esc(ar.note||"記録あり")+" ("+ar.date+")" : "空気循環 未記録"}</div></div>`;
    }).join("") : `<div class="empty">右下の＋で置き場所を登録（例：リビング窓際）</div>`;
  } else {
    main.innerHTML = `<div class="card"><b>複数端末の同期（Googleドライブ）</b>${!GOOGLE_CLIENT_ID ? `<div class="mu">未設定です（OAuthクライアントIDが必要）</div>` : `<div class="mu" id="syncst">${esc(syncStatus())}</div><div class="btns"><button class="btn" data-act="sync">${localStorage.getItem("plant_sync_on")?"今すぐ同期":"Googleドライブと連携"}</button></div>`}</div><div class="card"><b>データのバックアップ</b><div class="mu">データはこの端末のブラウザ内にだけ保存されています。機種変更前に書き出してください。</div><div class="btns"><button class="btn" data-act="export">書き出す</button><button class="btn s" data-act="import">読み込む</button></div></div><div class="mu">植物 ${S.plants.length} / 場所 ${S.places.length} / 記録 ${S.logs.length}</div>`;
  }
}

function logHtml(l, withName){
  const p = withName && plantById(l.plantId);
  return `<div class="log"><span class="tag">${TYPE[l.type]}</span>${l.date}${p?" "+esc(p.name):""}
    ${l.value!==""&&l.value!=null ? `<b> ${esc(l.value)}${l.type==="lux"?" lux":l.type==="growth"?" cm":l.type==="air"?" 分":""}</b>` : ""}
    ${l.note?`<div>${esc(l.note)}</div>`:""}${l.photo?`<img class="big" style="margin:6px 0 0" src="${l.photo}">`:""}
    <button class="btn d sm" style="float:right;margin-top:-26px" data-act="dellog" data-id="${l.id}">削除</button></div>`;
}

function renderPlant(main){
  const p = plantById(view.id); if (!p) { view = null; return render(); }
  $("#title").textContent = p.name;
  const pl = placeById(p.placeId), w = dueInfo(p,"water"), f = dueInfo(p,"fert");
  const logs = logsOf(l => l.plantId === p.id);
  main.innerHTML = `${p.photo?`<img class="big" src="${p.photo}">`:""}
  <div class="card"><div>${esc(p.species)||"品種未設定"}</div><div class="mu">購入日：${esc(p.bought)||"-"}　置き場所：${pl?esc(pl.name):"-"}</div>
  <div class="mu">💧${w?`${w.days}日おき（<span class="${w.due?"due":"ok"}">${w.text}</span>）`:"未設定"}　🧪${f?`${f.days}日おき（<span class="${f.due?"due":"ok"}">${f.text}</span>）`:"未設定"}</div>
  ${p.memo?`<div style="margin-top:6px">${esc(p.memo)}</div>`:""}</div>
  <div class="btns"><button class="btn w" data-act="done" data-id="${p.id}" data-t="water">💧水やり済</button><button class="btn" data-act="done" data-id="${p.id}" data-t="fert">🧪肥料済</button><button class="btn s" data-act="growth" data-id="${p.id}">🌱成長記録</button><button class="btn s" data-act="lux" data-id="${p.id}">☀️LUX</button></div>
  <h2>履歴</h2><div class="card">${logs.length ? logs.map(l => logHtml(l)).join("") : `<div class="mu">まだ記録がありません</div>`}</div>
  <button class="btn d" data-act="delplant" data-id="${p.id}">この植物を削除</button>`;
}

function renderPlace(main){
  const pl = placeById(view.id); if (!pl) { view = null; return render(); }
  $("#title").textContent = pl.name;
  const ps = S.plants.filter(p => p.placeId === pl.id);
  const logs = logsOf(l => l.placeId === pl.id && ["lux","air"].includes(l.type));
  main.innerHTML = `<div class="card"><b>この場所の植物</b><div class="mu">${ps.length ? ps.map(p => esc(p.name)).join("、") : "なし"}</div>${pl.memo?`<div style="margin-top:6px">${esc(pl.memo)}</div>`:""}</div>
  <div class="btns"><button class="btn s" data-act="placelux" data-id="${pl.id}">☀️LUXを記録</button><button class="btn s" data-act="placeair" data-id="${pl.id}">🌀空気循環を記録</button></div>
  <h2>履歴</h2><div class="card">${logs.length ? logs.map(l => logHtml(l)).join("") : `<div class="mu">まだ記録がありません</div>`}</div>
  <button class="btn d" data-act="delplace" data-id="${pl.id}">この場所を削除</button>`;
}

// ---------- フォーム ----------
const placeOpts = () => [["", "未設定"], ...S.places.map(p => [p.id, p.name])];
function plantForm(p){
  const isNew = !p; p = p || {};
  openForm(isNew ? "植物を登録" : "植物を編集", [
    {n:"name",l:"名前（必須）",v:p.name}, {n:"species",l:"品種",v:p.species}, {n:"bought",l:"購入日",t:"date",v:p.bought},
    {n:"placeId",l:"置き場所",t:"select",o:placeOpts(),v:p.placeId||""},
    {n:"waterDays",l:"水やり間隔（日）",t:"number",v:p.waterDays}, {n:"fertDays",l:"肥料間隔（日）",t:"number",v:p.fertDays},
    {n:"memo",l:"メモ",t:"textarea",v:p.memo}, {n:"photo",l:"写真（変更する場合のみ）",t:"photo"}
  ], o => {
    if (!o.name) return;
    const photo = o.photo || p.photo || null; delete o.photo;
    if (isNew) S.plants.push({id:uid(), ...o, photo, u:now()}); else Object.assign(p, o, {photo}, {u:now()});
  });
}
function placeForm(pl){
  const isNew = !pl; pl = pl || {};
  openForm(isNew ? "置き場所を登録" : "置き場所を編集", [{n:"name",l:"名前（必須）",v:pl.name},{n:"memo",l:"メモ（窓の向きなど）",t:"textarea",v:pl.memo}],
    o => { if (!o.name) return; if (isNew) S.places.push({id:uid(), ...o, u:now()}); else Object.assign(pl, o, {u:now()}); });
}
function addLog(base, fields, title){
  openForm(title, [{n:"date",l:"日付",t:"date",v:today()}, ...fields], o => {
    S.logs.push({id:uid(), value:"", note:"", photo:null, ...base, ...o, u:now()});
  });
}

// ---------- イベント ----------
document.addEventListener("click", e => {
  const nav = e.target.closest("nav button");
  if (nav) { tab = nav.dataset.tab; view = null; return render(); }
  const el = e.target.closest("[data-act]"); if (!el) return;
  const id = el.dataset.id, a = el.dataset.act;
  if (a === "plant") { view = {k:"plant", id}; render(); scrollTo(0,0); }
  else if (a === "place") { view = {k:"place", id}; render(); scrollTo(0,0); }
  else if (a === "done") { S.logs.push({id:uid(), type:el.dataset.t, plantId:id, date:today(), value:"", note:"", photo:null, u:now()}); save(); render(); }
  else if (a === "growth") addLog({type:"growth", plantId:id}, [{n:"value",l:"草丈（cm）",t:"number"},{n:"note",l:"メモ",t:"textarea"},{n:"photo",l:"写真",t:"photo"}], "成長記録");
  else if (a === "lux") addLog({type:"lux", plantId:id, placeId:plantById(id).placeId||null}, [{n:"value",l:"LUX",t:"number"},{n:"note",l:"メモ",t:"textarea"}], "LUXを記録");
  else if (a === "placelux") addLog({type:"lux", placeId:id}, [{n:"value",l:"LUX",t:"number"},{n:"note",l:"メモ（時間帯・天気など）",t:"textarea"}], "LUXを記録");
  else if (a === "placeair") addLog({type:"air", placeId:id}, [{n:"value",l:"稼働時間（分）",t:"number"},{n:"note",l:"メモ（サーキュレーターの向き・強さなど）",t:"textarea"}], "空気循環を記録");
  else if (a === "dellog") { if (confirm("この記録を削除しますか？")) { tomb([id]); S.logs = S.logs.filter(l => l.id !== id); save(); render(); } }
  else if (a === "delplant") { if (confirm("植物と記録を削除しますか？")) { tomb([id, ...S.logs.filter(l => l.plantId === id).map(l => l.id)]); S.plants = S.plants.filter(p => p.id !== id); S.logs = S.logs.filter(l => l.plantId !== id); view = null; save(); render(); } }
  else if (a === "delplace") { if (confirm("置き場所を削除しますか？（記録も削除されます）")) { tomb([id, ...S.logs.filter(l => l.placeId === id).map(l => l.id)]); S.places = S.places.filter(p => p.id !== id); S.plants.forEach(p => { if (p.placeId === id) { p.placeId = ""; touch(p); } }); S.logs = S.logs.filter(l => l.placeId !== id); view = null; save(); render(); } }
  else if (a === "export") {
    const a2 = document.createElement("a"); a2.href = URL.createObjectURL(new Blob([JSON.stringify(S)], {type:"application/json"}));
    a2.download = "plant_care_backup_" + today() + ".json"; a2.click();
  } else if (a === "sync") syncNow(true);
  else if (a === "import") {
    const i = document.createElement("input"); i.type = "file"; i.accept = ".json,application/json";
    i.onchange = async () => { try { const d = JSON.parse(await i.files[0].text()); if (!Array.isArray(d.plants) || !Array.isArray(d.places) || !Array.isArray(d.logs)) throw 0;
      if (confirm("現在のデータを置き換えて読み込みますか？")) { normalize(d); ["plants","places","logs"].forEach(k => d[k].forEach(touch)); S = d; save(); render(); } } catch { alert("読み込めないファイルです"); } };
    i.click();
  }
});
$("#back").onclick = () => { view = null; render(); };
$("#edit").onclick = () => view.k === "plant" ? plantForm(plantById(view.id)) : placeForm(placeById(view.id));
$("#fab").onclick = () => tab === "plants" ? plantForm() : placeForm();

// ---------- Googleドライブ同期（appDataFolder。サーバー不要） ----------
// OAuthクライアントID（ウェブ）。公開されても問題ない種類の値。空のあいだは同期機能は使えない。
const GOOGLE_CLIENT_ID = "218853536367-1krvvs2koi9q2av5hrld2ndcll43latp.apps.googleusercontent.com";
const FILE_NAME = "plant_care.json", API = "https://www.googleapis.com";
let token = null, tokenExp = 0, tokenClient = null, syncing = false, syncAgain = false, syncMsg = "", syncTimer = null;
const lsGet = k => { try { return localStorage.getItem(k); } catch { return null; } };
function syncStatus(){
  const t = lsGet("plant_sync_last");
  return syncMsg || (t ? "最終同期：" + new Date(+t).toLocaleString("ja-JP") : "まだ同期していません");
}
function setSyncMsg(m){ syncMsg = m; const el = $("#syncst"); if (el) el.textContent = syncStatus(); }

function loadGis(){
  return new Promise((ok, ng) => {
    if (window.google?.accounts?.oauth2) return ok();
    const s = document.createElement("script"); s.src = "https://accounts.google.com/gsi/client";
    s.onload = ok; s.onerror = () => ng(new Error("Googleに接続できません（オフライン？）")); document.head.appendChild(s);
  });
}
// interactive=true: 画面操作から呼ばれたときだけログイン画面を出す
async function getToken(interactive){
  if (token && now() < tokenExp - 60000) return token;
  await loadGis();
  return new Promise((ok, ng) => {
    tokenClient = tokenClient || google.accounts.oauth2.initTokenClient({
      client_id: GOOGLE_CLIENT_ID, scope: "https://www.googleapis.com/auth/drive.appdata", callback: () => {}
    });
    tokenClient.callback = r => {
      if (r.error) return ng(new Error(r.error === "access_denied" ? "許可されませんでした" : "ログインが必要です"));
      token = r.access_token; tokenExp = now() + r.expires_in * 1000; ok(token);
    };
    tokenClient.error_callback = () => ng(new Error("ログインが必要です（同期ボタンを押してください）"));
    tokenClient.requestAccessToken({prompt: interactive ? "" : "none"});
  });
}
async function gfetch(url, opt){
  const r = await fetch(API + url, {...opt, headers: {Authorization: "Bearer " + token, ...(opt?.headers||{})}});
  if (!r.ok) throw new Error("Googleドライブとの通信に失敗しました(" + r.status + ")");
  return r;
}
// 新しい更新日時を採用して統合。削除の印のほうが新しければ削除を優先。
function mergeState(a, b){
  const del = new Map();
  [...a.del, ...b.del].forEach(d => { if (!del.has(d.id) || del.get(d.id) < d.u) del.set(d.id, d.u); });
  const out = {del: [...del].map(([id, u]) => ({id, u}))};
  ["plants","places","logs"].forEach(k => {
    const m = new Map();
    [...a[k], ...b[k]].forEach(o => { const c = m.get(o.id); if (!c || o.u > c.u) m.set(o.id, o); });
    out[k] = [...m.values()].filter(o => !(del.has(o.id) && del.get(o.id) >= o.u));
  });
  return out;
}
async function syncNow(interactive){
  if (!GOOGLE_CLIENT_ID) return;
  if (syncing) { syncAgain = true; return; }
  syncing = true; setSyncMsg("同期中…");
  try {
    await getToken(interactive);
    const q = encodeURIComponent(`name='${FILE_NAME}'`);
    const files = (await (await gfetch(`/drive/v3/files?spaces=appDataFolder&q=${q}&fields=files(id)`)).json()).files;
    let id = files[0]?.id, remote = null;
    if (id) { const d = await (await gfetch(`/drive/v3/files/${id}?alt=media`)).json(); if (Array.isArray(d.plants) && Array.isArray(d.places) && Array.isArray(d.logs)) remote = normalize(d); }
    S = remote ? mergeState(normalize(S), remote) : S;
    saveLocal();
    const body = JSON.stringify(S);
    if (id) await gfetch(`/upload/drive/v3/files/${id}?uploadType=media`, {method: "PATCH", headers: {"Content-Type": "application/json"}, body});
    else {
      const bd = "plant" + uid(), meta = JSON.stringify({name: FILE_NAME, parents: ["appDataFolder"]});
      await gfetch(`/upload/drive/v3/files?uploadType=multipart`, {method: "POST", headers: {"Content-Type": "multipart/related; boundary=" + bd},
        body: `--${bd}\r\nContent-Type: application/json\r\n\r\n${meta}\r\n--${bd}\r\nContent-Type: application/json\r\n\r\n${body}\r\n--${bd}--`});
    }
    try { localStorage.setItem("plant_sync_on", "1"); localStorage.setItem("plant_sync_last", String(now())); } catch {}
    syncMsg = ""; render();
  } catch (e) {
    token = null; setSyncMsg("同期できませんでした：" + e.message);
  }
  syncing = false;
  if (syncAgain) { syncAgain = false; scheduleSync(); }
}
function scheduleSync(){
  if (!GOOGLE_CLIENT_ID || !lsGet("plant_sync_on")) return;
  clearTimeout(syncTimer); syncTimer = setTimeout(() => syncNow(false), 3000);
}

// ---------- 起動 ----------
function start(){ dbGet().then(d => { if (d) S = normalize(d); render(); scheduleSync(); }); }
dbReq.onsuccess = start;
if ("serviceWorker" in navigator && location.protocol !== "file:") navigator.serviceWorker.register("sw.js");
