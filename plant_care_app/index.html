<html lang="ja">
<head>

<title>HOUSE PLANTS</title>
<style>
:root{--g:#2f6b4f;--gl:#eef5f0;--bg:#f7faf8;--tx:#1d2b24;--mu:#7d8c84;--bd:#e1ebe5;--red:#b0483e;--bl:#4a7a8c;--gold:#b8975a;--card:#fff;--nav:#255c43;--navtx:#a9c9b8;--navon:#e3c98f;--barbg:rgba(247,250,248,.96);--serif:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif}
/* デザイン（この端末だけの設定。html の data-theme で切替） */
html[data-theme="night"]{--g:#3f8a63;--gl:#1f3027;--bg:#121c17;--tx:#e8efe9;--mu:#8fa399;--bd:#2a3d33;--red:#d9776c;--bl:#5f93a6;--gold:#c9a965;--card:#1b2a22;--nav:#0b130f;--navtx:#7f958a;--navon:#e3c98f;--barbg:rgba(18,28,23,.96)}
html[data-theme="sand"]{--g:#8a6f4d;--gl:#f0e8d8;--bg:#f6f1e8;--tx:#2d2a26;--mu:#8a8274;--bd:#e6ddcc;--red:#b0483e;--bl:#5f7f8a;--gold:#a47c3f;--card:#fffdf9;--nav:#5a4a35;--navtx:#cdbfa6;--navon:#f0d9a0;--barbg:rgba(246,241,232,.96)}
html[data-theme="rose"]{--g:#b45f72;--gl:#f8e9ea;--bg:#fbf5f4;--tx:#3a2a2c;--mu:#9a8a8a;--bd:#f0dfdf;--red:#a63d3d;--bl:#6f8aa0;--gold:#c0996a;--card:#fff;--nav:#8f4455;--navtx:#e8c3ca;--navon:#fff0d0;--barbg:rgba(251,245,244,.96)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Hiragino Sans","Yu Gothic",system-ui,sans-serif;letter-spacing:.04em;padding-bottom:80px}
header{background:var(--bg);color:var(--tx);padding:18px 20px 14px;border-bottom:1px solid var(--gold);position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:8px}
header h1{font-family:var(--serif);font-size:18px;font-weight:500;letter-spacing:.18em;margin:0;flex:1}
header button{background:none;color:var(--g);border:0;padding:6px 4px;font-size:14px;letter-spacing:.08em}
main{padding:18px 18px}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--nav);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav button{flex:1;border:0;background:none;padding:18px 0 16px;font-family:Georgia,"Times New Roman",var(--serif);font-size:10px;letter-spacing:.16em;color:var(--navtx)}
nav button.on{color:var(--navon);box-shadow:inset 0 2px 0 var(--gold)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:6px;padding:14px;margin-bottom:12px}
.pg{display:grid;grid-template-columns:repeat(2,1fr);gap:16px 14px}
.pc{background:var(--card);border:1px solid var(--bd);border-radius:6px;overflow:hidden}
.pi{width:100%;aspect-ratio:4/5;object-fit:cover;display:flex;align-items:center;justify-content:center;background:var(--gl);font-size:44px;color:var(--gold)}
.pb{padding:12px 12px 14px}.pn{font-family:var(--serif);font-weight:500;font-size:16px;letter-spacing:.08em;margin-bottom:2px}
.row{display:flex;gap:10px;align-items:center}
.grow{flex:1;min-width:0}
.thumb{width:56px;height:56px;border-radius:4px;object-fit:cover;background:var(--gl);flex:none;display:flex;align-items:center;justify-content:center;font-size:26px;color:var(--gold)}
.big{width:100%;max-height:340px;object-fit:cover;border-radius:6px;margin-bottom:14px}
h2{font-family:var(--serif);font-size:13px;font-weight:500;letter-spacing:.22em;color:var(--gold);margin:28px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--bd)}
.mu{color:var(--mu);font-size:13px}
.due{color:var(--red);font-weight:700}
.ok{color:var(--g)}
.btn{border:0;border-radius:4px;padding:11px 18px;font-size:13px;letter-spacing:.12em;background:var(--g);color:#f6f2ea}
.btn.w{background:var(--bl)}
.btn.s{background:transparent;color:var(--g);border:1px solid var(--gold)}
.btn.d{background:transparent;color:var(--red);border:1px solid var(--bd)}
.btn.sm{padding:7px 10px;font-size:13px}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.fab{position:fixed;right:16px;bottom:88px;width:54px;height:54px;border-radius:50%;border:0;background:var(--g);color:var(--navon);font-size:26px;font-weight:300;border:1px solid var(--gold);box-shadow:0 6px 18px rgba(31,42,36,.25);z-index:6}
.modal{position:fixed;inset:0;background:rgba(20,45,34,.45);z-index:20;display:flex;align-items:flex-end}
.modal form{background:var(--card);width:100%;max-height:90vh;overflow:auto;border-radius:12px 12px 0 0;padding:20px}
.modal label{display:block;font-size:13px;color:var(--mu);margin-top:10px}
.modal input,.modal select,.modal textarea{width:100%;font-size:16px;padding:9px;border:1px solid var(--bd);border-radius:8px;margin-top:3px;background:var(--card);color:var(--tx)}
.log{border-top:1px solid var(--bd);padding:8px 0;font-size:14px}
.log:first-child{border-top:0}
.tag{display:inline-block;background:var(--gl);color:var(--g);border-radius:6px;padding:1px 7px;font-size:12px;margin-right:4px}
.empty{text-align:center;color:var(--mu);padding:30px 10px}
.lg{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}.lgc{flex:1;min-width:0}
.lt{display:block;width:64px;height:64px;object-fit:cover;border-radius:4px;margin-top:6px}
.mg{display:grid;grid-template-columns:repeat(2,1fr);gap:16px 14px}
.mc{background:var(--card);border:1px solid var(--bd);border-radius:6px;overflow:hidden}
.mp{width:100%;aspect-ratio:1;object-fit:cover;display:flex;align-items:center;justify-content:center;background:var(--gl);font-size:12px;letter-spacing:.3em}
.mt{padding:9px 11px 11px}.md{font-size:11px;color:var(--mu);letter-spacing:.1em}.mn{font-family:var(--serif);font-size:14px;letter-spacing:.06em;margin-top:2px}
.th{padding:10px 0;border-top:1px solid var(--bd);cursor:pointer}.th.on b{color:var(--g)}
.sw{display:inline-flex;flex:none;border:1px solid var(--bd);border-radius:4px;overflow:hidden}.sw i{width:18px;height:28px;display:block}
.sc{cursor:pointer}.sc.on{border-color:var(--gold);background:var(--gl)}
.ck{width:26px;height:26px;border:1px solid var(--gold);border-radius:4px;display:flex;align-items:center;justify-content:center;color:var(--g);font-size:16px;flex:none;background:var(--card)}
.bar{position:fixed;left:0;right:0;bottom:calc(54px + env(safe-area-inset-bottom));padding:10px 18px;background:var(--barbg);border-top:1px solid var(--bd);z-index:6}
.bar .btn{width:100%}
.np{font-family:Georgia,"Times New Roman",var(--serif);color:var(--gold);text-align:center;line-height:1.5}
.thumb.np{font-size:8px;letter-spacing:.12em}.pi.np{font-size:12px;letter-spacing:.3em}
#splash{position:fixed;inset:0;z-index:100;background:linear-gradient(#2f6b4f,#1c4a37);display:flex;align-items:center;justify-content:center;animation:spOut .8s ease 2.1s forwards}
#splash img{width:min(78vw,300px);opacity:0;transform:scale(.97);animation:spIn 1.1s ease .2s forwards}
@keyframes spIn{to{opacity:1;transform:none}}
@keyframes spOut{to{opacity:0;visibility:hidden}}
@media (prefers-reduced-motion:reduce){#splash{animation-duration:.01s;animation-delay:.6s}#splash img{animation-duration:.01s}}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal.wk{text-align:center;font-size:12px;color:var(--mu);margin-bottom:3px}
.cd{border:1px solid var(--bd);background:var(--card);border-radius:4px;min-height:64px;padding:3px 1px;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:1px;color:var(--tx);overflow:hidden}
.cd b{font-size:13px}.cd i{font-style:normal;white-space:nowrap}
.cd.t{border-color:var(--gold);background:var(--gl)}.cd.sel{outline:1px solid var(--g);outline-offset:1px}
.alb{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.ai{position:relative}.ai img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:4px;display:block}
.ai span{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.45);color:#fff;font-size:11px;text-align:center;border-radius:0 0 8px 8px;padding:1px 0}
.lb{align-items:center;justify-content:center;flex-direction:column;background:rgba(0,0,0,.85);color:#fff;padding:12px;text-align:center}
.lb figure{margin:0;flex:1;min-width:0}.lb figcaption{font-size:12px;margin-top:4px}
.lb img{width:100%;max-height:68vh;object-fit:contain;border-radius:8px}
.cmp{display:flex;gap:6px;width:100%}
.lb .btn.s{background:#fff}
.cr{color:var(--gold)}.cw{color:var(--bl)}.cf{color:var(--g)}.dn{color:var(--mu)}
</style>

<div id="splash"><img src="icon.svg" alt="HOUSE PLANTS"></div>
<script>
// 起動時のロゴ表示：ふわっと現れて、消えるとアプリ画面。タップで即スキップ。Googleログイン直後は出さない
(function(){ var s = document.getElementById("splash"), rm = function(){ s.remove(); };
  if (location.hash.indexOf("access_token") >= 0 || location.hash.indexOf("error") >= 0) return rm();
  s.addEventListener("animationend", function(e){ if (e.animationName === "spOut") rm(); });
  s.addEventListener("click", rm); setTimeout(rm, 4000); })();
</script>
<header><button id="back" hidden>‹ 戻る</button><h1 id="title">HOUSE PLANTS</h1><button id="edit" hidden>編集</button></header>
<main id="main"></main>
<button class="fab" id="fab" hidden>＋</button>
<nav id="nav">
<button data-tab="today">TO DO</button>
<button data-tab="calendar">CALENDAR</button>
<button data-tab="plants">PLANTS</button>
<button data-tab="memory">MEMORY</button>
<button data-tab="settings">SETTINGS</button>
</nav>
<script>
"use strict";
// ---------- 保存（IndexedDBに全データを1件で保存） ----------
// 各データ(plants/places/logs)は更新日時 u(ms) を持つ。削除は S.del に {id,u} の印を残す（同期用）。
let S = {plants:[], places:[], logs:[], ferts:[], mems:[], specs:[], del:[]};
const dbReq = indexedDB.open("plant_care", 1);
dbReq.onupgradeneeded = () => dbReq.result.createObjectStore("kv");
function dbGet(){return new Promise(r=>{const q=dbReq.result.transaction("kv").objectStore("kv").get("state");q.onsuccess=()=>r(q.result);q.onerror=()=>r(null);});}
function saveLocal(){dbReq.result.transaction("kv","readwrite").objectStore("kv").put(S,"state");}
function save(){ saveLocal(); scheduleSync(); }
const now = () => Date.now();
const touch = o => { o.u = now(); return o; };
function tomb(ids){ const u = now(); ids.forEach(id => S.del.push({id, u})); }
function normalize(d){ d.del = d.del || []; d.ferts = d.ferts || []; d.mems = d.mems || []; d.specs = d.specs || []; ["plants","places","logs","ferts","mems","specs"].forEach(k => d[k].forEach(o => { if (typeof o.u !== "number") o.u = 0; })); return d; }

// ---------- デザイン（この端末だけ。同期しない） ----------
const THEMES = [
  {id:"forest", name:"フォレスト", note:"白と緑にゴールド", sw:["#f7faf8","#2f6b4f","#b8975a"], meta:"#f7faf8"},
  {id:"night",  name:"ナイト",     note:"深い緑黒のダーク", sw:["#121c17","#3f8a63","#c9a965"], meta:"#121c17"},
  {id:"sand",   name:"サンド",     note:"ベージュとブラウン", sw:["#f6f1e8","#8a6f4d","#a47c3f"], meta:"#f6f1e8"},
  {id:"rose",   name:"ローズ",     note:"やさしいピンク",   sw:["#fbf5f4","#b45f72","#c0996a"], meta:"#fbf5f4"}
];
const curTheme = () => { try { const t = localStorage.getItem("plant_theme"); return THEMES.some(x => x.id === t) ? t : "forest"; } catch { return "forest"; } };
function applyTheme(id){
  const t = THEMES.find(x => x.id === id) || THEMES[0];
  document.documentElement.setAttribute("data-theme", t.id);
  document.querySelector('meta[name="theme-color"]')?.setAttribute("content", t.meta);
  try { localStorage.setItem("plant_theme", t.id); } catch {}
}
applyTheme(curTheme());

// ---------- ユーティリティ ----------
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const today = () => { const d = new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); };
const dayDiff = (a, b) => Math.round((new Date(a) - new Date(b)) / 864e5);
const plantById = id => S.plants.find(p => p.id === id);
const placeById = id => S.places.find(p => p.id === id);
const fertById = id => S.ferts.find(f => f.id === id);
const logsOf = (f) => S.logs.filter(f).sort((a,b) => b.date.localeCompare(a.date) || b.id.localeCompare(a.id));
const TYPE = {water:"水やり", fert:"肥料", repot:"植え替え", growth:"成長", lux:"LUX", air:"空気循環"};

function resizePhoto(file){
  return new Promise(res => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const m = 900, k = Math.min(1, m / Math.max(img.width, img.height));
      const c = document.createElement("canvas"); c.width = img.width*k; c.height = img.height*k;
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url); res(c.toDataURL("image/jpeg", .8));
    };
    img.onerror = () => res(null);
    img.src = url;
  });
}

// フォーム：fields = [{n,l,t:'text'|'number'|'date'|'select'|'textarea'|'photo',v,o:[[値,表示]]}]
function openForm(title, fields, onOk){
  const m = document.createElement("div"); m.className = "modal";
  m.innerHTML = `<form><h2 style="margin-top:0">${esc(title)}</h2>` + fields.map(f => {
    const v = esc(f.v ?? "");
    let inp;
    if (f.t === "select") inp = `<select name="${f.n}">` + f.o.map(([val,lab]) => `<option value="${esc(val)}" ${val===f.v?"selected":""}>${esc(lab)}</option>`).join("") + `</select>`;
    else if (f.t === "textarea") inp = `<textarea name="${f.n}" rows="3">${v}</textarea>`;
    else if (f.t === "photo") inp = `<input type="file" name="${f.n}" accept="image/*">`;
    else inp = `<input name="${f.n}" type="${f.t||"text"}" value="${v}" ${f.t==="number"?'step="any" inputmode="decimal"':""} ${f.dl?`list="dl_${f.n}" autocomplete="off"`:""}>`
      + (f.dl ? `<datalist id="dl_${f.n}">${f.dl.map(x => `<option value="${esc(x)}">`).join("")}</datalist>` : "");
    return `<label>${esc(f.l)}${inp}</label>`;
  }).join("") + `<div class="btns"><button class="btn grow">保存</button><button type="button" class="btn s" data-x>キャンセル</button></div></form>`;
  document.body.appendChild(m);
  m.querySelector("[data-x]").onclick = () => m.remove();
  m.onclick = e => { if (e.target === m) m.remove(); };
  m.querySelector("form").onsubmit = async e => {
    e.preventDefault();
    const out = {};
    for (const f of fields) {
      const el = e.target.elements[f.n];
      out[f.n] = f.t === "photo" ? (el.files[0] ? await resizePhoto(el.files[0]) : null) : el.value.trim();
    }
    m.remove(); onOk(out); save(); render();
  };
}

// ---------- 状態 ----------
let tab = "today", view = null; // view: {k:'plant'|'place', id}
let sel = null; // 今日タブの「まとめて済にする」選択中の項目（"植物ID:water|fert" のSet）。通常は null
const lastLog = (pid, type) => logsOf(l => l.plantId === pid && l.type === type)[0];
const addMonths = (s, n) => { const [y, m, d] = s.split("-").map(Number), last = new Date(y, m - 1 + n + 1, 0).getDate(); return ymd(new Date(y, m - 1 + n, Math.min(d, last))); };
function repotNextDate(p){
  const n = Math.round(+p.repotMonths), l = lastLog(p.id, "repot");
  if (l) return p.repotNext && p.repotNext > l.date ? p.repotNext : (n >= 1 ? addMonths(l.date, n) : null);
  return p.repotNext || (n >= 1 && p.bought ? addMonths(p.bought, n) : null);
}
function dueInfo(p, type){
  if (type === "repot") {
    const next = repotNextDate(p); if (!next) return null;
    const late = dayDiff(today(), next);
    return {late, due: late >= 0, text: late > 0 ? `${late}日超過` : late === 0 ? "今日" : `あと${-late}日`, days: 0};
  }
  const days = +p[type === "water" ? "waterDays" : "fertDays"];
  if (!days) return null;
  const l = lastLog(p.id, type);
  if (!l) return {late: 0, text: "記録なし", due: true, days};
  const late = dayDiff(today(), l.date) - days;
  return {late, due: late >= 0, text: late > 0 ? `${late}日超過` : late === 0 ? "今日" : `あと${-late}日`, days};
}
const yen = v => v === "" || v == null || isNaN(+v) ? "-" : "¥" + Number(v).toLocaleString("ja-JP");
function thumb(p){return p.photo ? `<img class="thumb" src="${p.photo}">` : `<div class="thumb np">NO<br>PHOTO</div>`;}

// ---------- カレンダー ----------
const pad = n => String(n).padStart(2, "0");
const ymd = d => d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate());
const addDays = (s, n) => { const [y,m,d] = s.split("-").map(Number); return ymd(new Date(y, m-1, d+n)); };
let calM = (() => { const d = new Date(); return {y: d.getFullYear(), m: d.getMonth()}; })(), calSel = today();
// 範囲内の {日付: [{p,t,done}]}。済み=記録、予定=最後の記録＋間隔から先へ繰り返し（期限超過は今日に表示）
function calData(from, to){
  const ev = {}, add = (dt, o) => (ev[dt] = ev[dt] || []).push(o), td = today();
  S.logs.forEach(l => { const p = plantById(l.plantId); if (["water","fert","repot"].includes(l.type) && p && l.date >= from && l.date <= to) add(l.date, {p, t: l.type, done: true}); });
  S.plants.forEach(p => ["water","fert"].forEach(t => {
    const n = Math.round(+p[t === "water" ? "waterDays" : "fertDays"]); if (!(n >= 1)) return;
    const l = lastLog(p.id, t); let x = l ? addDays(l.date, n) : td; if (x < td) x = td;
    for (; x <= to; x = addDays(x, n)) if (x >= from) add(x, {p, t, done: false});
  }));
  S.plants.forEach(p => {
    const next = repotNextDate(p); if (!next) return;
    const n = Math.round(+p.repotMonths); let x = next < td ? td : next;
    for (let i = 0; x <= to && i < 60; i++) { if (x >= from) add(x, {p, t: "repot", done: false}); if (!(n >= 1)) break; x = addMonths(x, n); }
  });
  return ev;
}
function calHtml(){
  const {y, m} = calM, first = new Date(y, m, 1), last = new Date(y, m+1, 0), td = today();
  const ev = calData(ymd(first), ymd(last));
  let cells = "";
  for (let i = 0; i < first.getDay(); i++) cells += `<div></div>`;
  for (let d = 1; d <= last.getDate(); d++) {
    const dt = y + "-" + pad(m+1) + "-" + pad(d), list = ev[dt] || [];
    const chip = (t, done) => { const n = list.filter(e => e.t === t && e.done === done).length; return n ? `<i class="${done?"dn":{water:"cw",fert:"cf",repot:"cr"}[t]}">${done?"✓":""}${{water:"水",fert:"肥",repot:"植"}[t]}${n}</i>` : ""; };
    cells += `<button class="cd${dt===td?" t":""}${dt===calSel?" sel":""}" data-act="calday" data-id="${dt}"><b>${d}</b>${chip("water",false)}${chip("fert",false)}${chip("repot",false)}${chip("water",true)}${chip("fert",true)}${chip("repot",true)}</button>`;
  }
  const sel = (ev[calSel] || (() => { const [sy, sm] = calSel.split("-").map(Number); return sy === y && sm === m+1 ? [] : calData(calSel, calSel)[calSel] || []; })());
  const items = [...sel].sort((a, b) => a.done - b.done || a.p.name.localeCompare(b.p.name));
  const detail = items.length ? items.map(({p, t, done}) => {
    const d = !done && calSel === td ? dueInfo(p, t) : null;
    const st = done ? `<span class="ok">✓済み</span>` : d ? `<span class="${d.late > 0 || d.text === "記録なし" ? "due" : ""}">${d.text}</span>` : "予定";
    const btn = !done && calSel === td ? `<button class="btn sm ${t==="water"?"w":""}" data-act="done" data-id="${p.id}" data-t="${t}">済</button>` : "";
    return `<div class="card row" data-act="plant" data-id="${p.id}">${thumb(p)}<div class="grow"><b>${esc(p.name)}</b><div class="mu">${TYPE[t]}　${st}</div></div>${btn}</div>`;
  }).join("") : `<div class="empty">この日の予定・記録はありません</div>`;
  return `<div class="row" style="justify-content:space-between;margin-bottom:8px"><button class="btn s sm" data-act="calprev">‹</button><b>${y}年${m+1}月</b><span><button class="btn s sm" data-act="caltoday">今日</button> <button class="btn s sm" data-act="calnext">›</button></span></div>
  <div class="cal wk"><div style="color:var(--red)">日</div><div>月</div><div>火</div><div>水</div><div>木</div><div>金</div><div style="color:var(--bl)">土</div></div>
  <div class="cal">${cells}</div><h2>${calSel}</h2>${detail}<div class="mu">※水・肥の予定は「最後の記録＋間隔」から計算しています。「植」は、植物に入れた植え替え予定日です</div>`;
}

    const items = [];

    items.sort((a,b) => b.d.late - a.d.late);
    const info = ({p,t,d}) => `${thumb(p)}<div class="grow"><b>${esc(p.name)}</b><div class="mu">${TYPE[t]}　<span class="due">${d.text}</span></div></div>`;
    if (sel) sel = new Set([...sel].filter(k => items.some(i => i.p.id + ":" + i.t === k)));

          + items.map(i => { const k = i.p.id + ":" + i.t, on = sel.has(k); return `<div class="card row sc${on ? " on" : ""}" data-act="seltoggle" data-id="${k}">${info(i)}<span class="ck">${on ? "✓" : ""}</span></div>`; }).join("")

  } else if (tab === "memory") {

      : `<div class="empty">右下の＋で、思い出の写真を残しましょう<br>（お部屋と植物の写真など）</div>`;
  } else if (tab === "calendar") {
    main.innerHTML = calHtml();
  } else if (tab === "plants") {
    // 品種名の50音順、同じ品種のなかでは植物名の50音順（品種が空のものは最後）
    const cmp = (a, b) => (a || "").localeCompare(b || "", "ja");
    const sorted = [...S.plants].sort((a, b) => (!a.species !== !b.species) ? (a.species ? -1 : 1) : cmp(specKey(a.species), specKey(b.species)) || cmp(specKey(a.name), specKey(b.name)));
    main.innerHTML = S.plants.length ? `<div class="pg">` + sorted.map(p => {

  }
}

// 設定タブの「登録の管理」カード（置き場所・肥料の種類）。k = "place" | "fert"

function placeSub(pl){
  const n = S.plants.filter(p => p.placeId === pl.id).length, lx = logsOf(l => l.placeId === pl.id && l.type === "lux")[0], ar = logsOf(l => l.placeId === pl.id && l.type === "air")[0];

}
function manageCard(title, list, k, sub){
  return `<div class="card"><b>${title}</b>` + (list.length ? list.map(o => `<div class="row" style="padding:9px 0;border-top:1px solid var(--bd)"><div class="grow" ${k==="place" ? `data-act="place" data-id="${o.id}"` : ""}>${esc(o.name)}${sub ? `<div class="mu">${sub(o)}</div>` : o.memo ? `<div class="mu">${esc(o.memo)}</div>` : ""}</div><button class="btn s sm" data-act="${k}edit" data-id="${o.id}">編集</button><button class="btn d sm" data-act="del${k}" data-id="${o.id}">削除</button></div>`).join("") : `<div class="mu" style="margin-top:6px">まだ登録がありません</div>`)
    + `<div class="btns"><button class="btn s sm" data-act="${k}add">＋ 追加</button></div></div>`;
}
function logHtml(l, withName){
  const p = withName && plantById(l.plantId);
  return `<div class="log lg"><div class="lgc"><span class="tag">${TYPE[l.type]}</span>${l.date}${p?" "+esc(p.name):""}${l.type==="fert" && fertById(l.fertId) ? "　"+esc(fertById(l.fertId).name) : ""}
    ${l.value!==""&&l.value!=null ? `<b> ${esc(l.value)}${l.type==="lux"?" lux":l.type==="growth"?" cm":l.type==="air"?" 分":""}</b>` : ""}
    ${l.note?`<div>${esc(l.note)}</div>`:""}${l.photo?`<img class="lt" data-act="photo" data-id="${l.id}" src="${l.photo}">`:""}</div>
    <button class="btn d sm" data-act="dellog" data-id="${l.id}">削除</button></div>`;

function repotLine(p){
  const n = Math.round(+p.repotMonths), next = repotNextDate(p), d = dueInfo(p, "repot"), l = lastLog(p.id, "repot");
  if (!next && !(n >= 1) && !l) return "";

}
function renderPlant(main){

  ${repotLine(p)}<div class="mu">水 ${w?`${w.days}日おき（<span class="${w.due?"due":"ok"}">${w.text}</span>）`:"未設定"}　肥 ${f?`${f.days}日おき（<span class="${f.due?"due":"ok"}">${f.text}</span>）`:"未設定"}</div>

  <h2>写真アルバム</h2><div class="btns"><button class="btn" data-act="addphoto" data-id="${p.id}">写真を追加</button>${logs.filter(l => l.photo).length > 1 ? `<button class="btn s" data-act="cmplatest" data-id="${p.id}">最初の写真と最新を比較</button>` : ""}</div>${logs.some(l => l.photo) ? `<div class="alb">${logs.filter(l => l.photo).map(l => `<div class="ai" data-act="photo" data-id="${l.id}"><img src="${l.photo}"><span>${l.date.slice(2)}</span></div>`).join("")}</div>` : `<div class="mu">まだ写真がありません</div>`}
  <h2>履歴</h2><div class="card">${logs.length ? logs.map(l => logHtml(l)).join("") : `<div class="mu">まだ記録がありません</div>`}</div>

function renderPlace(main){

// ---------- フォーム ----------
const placeOpts = () => [["", "未設定"], ...S.places.map(p => [p.id, p.name])];
function plantForm(p){
  const isNew = !p; p = p || {};
  openForm(isNew ? "植物を登録" : "植物を編集", [
    {n:"name",l:"名前（必須）",v:p.name}, {n:"species",l:"品種（入力すると候補が出ます）",v:p.species,dl:speciesNames()}, {n:"bought",l:"購入日",t:"date",v:p.bought}, {n:"price",l:"購入金額（円）",t:"number",v:p.price}, {n:"shop",l:"購入先",v:p.shop}, {n:"soil",l:"用土（配合など）",v:p.soil},
    {n:"placeId",l:"置き場所",t:"select",o:placeOpts(),v:p.placeId||""},
    {n:"repotMonths",l:"植え替えの間隔（ヶ月・任意。例：6）",t:"number",v:p.repotMonths}, {n:"repotNext",l:"次回の植え替え予定日（任意。空欄なら購入日や最後の植え替えから自動計算）",t:"date",v:p.repotNext}, {n:"waterDays",l:"水やり間隔（日）",t:"number",v:p.waterDays}, {n:"fertDays",l:"肥料間隔（日）",t:"number",v:p.fertDays},
    {n:"memo",l:"メモ",t:"textarea",v:p.memo}, {n:"photo",l:"写真（変更する場合のみ）",t:"photo"}
  ], o => {

// 水やりの記録。肥料の種類を選ぶと、同じ日の「肥料」の記録も一緒に残す（肥料の予定が更新される）
function waterForm(pid){
  const fields = [{n:"date",l:"日付",t:"date",v:today()}];
  if (S.ferts.length) fields.push({n:"fertId",l:"肥料の種類（この水やりで使った場合）",t:"select",o:[["","なし（水のみ）"], ...S.ferts.map(f => [f.id, f.name])],v:""});
  fields.push({n:"note",l:"メモ",t:"textarea"});
  openForm("水やり", fields, o => {
    S.logs.push({id:uid(), type:"water", plantId:pid, date:o.date, value:"", note:o.note || "", photo:null, u:now()});
    if (o.fertId) S.logs.push({id:uid(), type:"fert", plantId:pid, fertId:o.fertId, date:o.date, value:"", note:"", photo:null, u:now()});
  });
}
// 選んだ項目（"植物ID:water|fert"）をまとめて記録。肥料は、肥料の項目を選んだ植物・肥料の種類を選んだ水やりの植物に1件ずつ
function batchDone(keys, o){
  const fertPlants = new Set();
  keys.forEach(k => {
    const [pid, t] = k.split(":"); if (!plantById(pid)) return;
    if (t === "water") { S.logs.push({id:uid(), type:"water", plantId:pid, date:o.date, value:"", note:"", photo:null, u:now()}); if (o.fertId) fertPlants.add(pid); }
    else if (t === "repot") S.logs.push({id:uid(), type:"repot", plantId:pid, date:o.date, value:"", note:"", photo:null, u:now()});
    else fertPlants.add(pid);
  });
  fertPlants.forEach(pid => S.logs.push({id:uid(), type:"fert", plantId:pid, ...(o.fertId ? {fertId:o.fertId} : {}), date:o.date, value:"", note:"", photo:null, u:now()}));
  sel = null;
}
// MEMORY：お部屋と植物の写真などの思い出。写真・日付・タイトル・メモ
function memForm(m){
  const isNew = !m; m = m || {};
  openForm(isNew ? "思い出を残す" : "思い出を編集", [{n:"date",l:"日付",t:"date",v:m.date || today()},{n:"title",l:"タイトル（任意）",v:m.title},{n:"photo",l:isNew ? "写真" : "写真（変更する場合のみ）",t:"photo"},{n:"note",l:"メモ",t:"textarea",v:m.note}],
    o => {
      const photo = o.photo || m.photo || null;
      if (!o.title && !photo && !o.note) return;
      const d = {date: o.date || today(), title: o.title, note: o.note, photo};
      if (isNew) S.mems.push({id:uid(), ...d, u:now()}); else Object.assign(m, d, {u:now()});
    });
}
function openMem(id){
  const m = S.mems.find(x => x.id === id); if (!m) return;
  const box = document.createElement("div"); box.className = "modal lb";
  box.innerHTML = `${m.photo ? `<img src="${m.photo}">` : ""}<div style="margin-top:8px;font-family:var(--serif);font-size:16px;letter-spacing:.08em">${esc(m.title)}</div><div style="font-size:12px">${esc(m.date)}</div>${m.note ? `<div style="margin-top:6px;font-size:13px;white-space:pre-wrap">${esc(m.note)}</div>` : ""}<div class="btns"><button class="btn s sm" data-m="e">編集</button><button class="btn s sm" data-m="d">削除</button><button class="btn s sm" data-m="x">閉じる</button></div>`;
  box.onclick = e => {
    const k = e.target.closest("[data-m]")?.dataset.m;

    else if (k === "e") { box.remove(); memForm(m); }
    else if (k === "d" && confirm("この思い出を削除しますか？")) { tomb([id]); S.mems = S.mems.filter(x => x.id !== id); save(); render(); box.remove(); }
  };
  document.body.appendChild(box);
}
// 品種：設定で登録した名前＋これまで植物に入れた名前を、植物登録の候補に出す
// 品種の同一判定用：全角半角・大文字小文字・ひらがなカタカナ・空白の違いを無視して比べる（保存する名前は変えない）
function specKey(s){
  return String(s || "").normalize("NFKC").replace(/[ぁ-ゖ]/g, c => String.fromCharCode(c.charCodeAt(0) + 0x60)).replace(/\s+/g, "").toLowerCase();
}
function sameSpec(a, b){ const k = specKey(a); return k !== "" && k === specKey(b); }
// 候補：設定で登録した名前を優先し、同じ品種（表記ゆれ）は1つにまとめる
function speciesNames(){
  const m = new Map();
  [...S.specs.map(s => s.name), ...S.plants.map(p => p.species)].filter(Boolean).forEach(n => { const k = specKey(n); if (!m.has(k)) m.set(k, n); });
  return [...m.values()].sort((a, b) => a.localeCompare(b, "ja"));
}
function specForm(s){
  const isNew = !s; s = s || {};
  openForm(isNew ? "品種を登録" : "品種を編集", [{n:"name",l:isNew ? "品種名（必須）" : "品種名（変えると、その品種の植物も書き換わります）",v:s.name}],
    o => {
      if (!o.name || S.specs.some(x => x.id !== s.id && sameSpec(x.name, o.name))) return;
      if (isNew) S.specs.push({id:uid(), name:o.name, u:now()});
      else { const old = s.name; Object.assign(s, {name:o.name, u:now()}); S.plants.forEach(p => { if (sameSpec(p.species, old) && p.species !== o.name) { p.species = o.name; touch(p); } }); }
    });
}
function fertForm(f){
  const isNew = !f; f = f || {};
  openForm(isNew ? "肥料の種類を登録" : "肥料の種類を編集", [{n:"name",l:"名前（必須）",v:f.name},{n:"memo",l:"メモ（成分・使う量など）",t:"textarea",v:f.memo}],
    o => { if (!o.name) return; if (isNew) S.ferts.push({id:uid(), ...o, u:now()}); else Object.assign(f, o, {u:now()}); });
}
function placeForm(pl){
  const isNew = !pl; pl = pl || {};
  openForm(isNew ? "置き場所を登録" : "置き場所を編集", [{n:"name",l:"名前（必須）",v:pl.name},{n:"lux",l:"LUX（目安・任意）",t:"number",v:pl.lux},{n:"air",l:"空気循環",t:"select",o:[["","未設定"],["良い","良い"],["普通","普通"],["悪い","悪い"]],v:pl.air||""},{n:"memo",l:"メモ（窓の向きなど）",t:"textarea",v:pl.memo}],
    o => { if (!o.name) return; if (isNew) S.places.push({id:uid(), ...o, u:now()}); else Object.assign(pl, o, {u:now()}); });
}
function addLog(base, fields, title){
  openForm(title, [{n:"date",l:"日付",t:"date",v:today()}, ...fields], o => {
    S.logs.push({id:uid(), value:"", note:"", photo:null, ...base, ...o, u:now()});
  });
}

// 写真の拡大表示。cmp=true で、その植物の最初の写真と並べて比較する
function openPhoto(id, cmp){
  const l = S.logs.find(x => x.id === id); if (!l) return;
  const all = logsOf(x => x.plantId === l.plantId && x.photo), first = all[all.length - 1], can = first && first.id !== l.id;
  const fig = (o, label) => `<figure><img src="${o.photo}"><figcaption>${label}<br>${esc(o.date)}${o.value!=="" && o.value!=null ? "　草丈 "+esc(o.value)+" cm" : ""}${o.note?"<br>"+esc(o.note):""}</figcaption></figure>`;
  let m = document.querySelector(".lb");
  if (!m) { m = document.createElement("div"); m.className = "modal lb"; document.body.appendChild(m); }
  m.innerHTML = (cmp && can ? `<div class="cmp">${fig(first, "最初")}${fig(l, dayDiff(l.date, first.date) + "日後")}</div>` : fig(l, TYPE[l.type]))
    + `<div class="btns">${can ? `<button class="btn s sm" id="lbt">${cmp ? "1枚で見る" : "最初の写真と比較"}</button>` : ""}<button class="btn s sm" id="lbe">編集</button><button class="btn s sm" id="lbd">写真を削除</button><button class="btn s sm" id="lbx">閉じる</button></div>`;
  m.onclick = e => { if (e.target === m) m.remove(); };
  m.querySelector("#lbx").onclick = () => m.remove();
  const t = m.querySelector("#lbt"); if (t) t.onclick = () => openPhoto(id, !cmp);
  m.querySelector("#lbe").onclick = () => { m.remove(); openForm("写真の情報を編集", [{n:"date",l:"日付",t:"date",v:l.date},{n:"value",l:"草丈（cm・任意）",t:"number",v:l.value},{n:"note",l:"メモ",t:"textarea",v:l.note}], o => { Object.assign(l, {date: o.date || l.date, value: o.value, note: o.note}); touch(l); }); };
  m.querySelector("#lbd").onclick = () => {
    if (!confirm("この写真を削除しますか？")) return;
    if (l.type === "growth" && (l.value === "" || l.value == null) && !l.note) { tomb([l.id]); S.logs = S.logs.filter(x => x.id !== l.id); } else { l.photo = null; touch(l); }
    save(); render(); m.remove();
  };
}

// ---------- イベント ----------
document.addEventListener("click", e => {
  const nav = e.target.closest("nav button");
  if (nav) { tab = nav.dataset.tab; view = null; sel = null; return render(); }
  const el = e.target.closest("[data-act]"); if (!el) return;
  const id = el.dataset.id, a = el.dataset.act;
  if (a === "calday") { calSel = id; render(); }
  else if (a === "calprev" || a === "calnext") { const d = new Date(calM.y, calM.m + (a === "calnext" ? 1 : -1), 1); calM = {y: d.getFullYear(), m: d.getMonth()}; calSel = ymd(d); render(); }
  else if (a === "caltoday") { const d = new Date(); calM = {y: d.getFullYear(), m: d.getMonth()}; calSel = today(); render(); }
  else if (a === "photo") openPhoto(id, true);
  else if (a === "cmplatest") { const ph = logsOf(l => l.plantId === id && l.photo); if (ph.length > 1) openPhoto(ph[0].id, true); }
  else if (a === "addphoto") addLog({type:"growth", plantId:id}, [{n:"photo",l:"写真",t:"photo"},{n:"value",l:"草丈（cm・任意）",t:"number"},{n:"note",l:"メモ",t:"textarea"}], "写真を追加");
  else if (a === "repotlog") addLog({type:"repot", plantId:id}, [{n:"note",l:"メモ（鉢のサイズ・土など）",t:"textarea"}], "植え替えを記録");
  else if (a === "plant") { view = {k:"plant", id}; render(); scrollTo(0,0); }
  else if (a === "place") { view = {k:"place", id}; render(); scrollTo(0,0); }
  else if (a === "done") {
    if (el.dataset.t === "water" && S.ferts.length) waterForm(id);
    else if (el.dataset.t === "fert" && S.ferts.length) addLog({type:"fert", plantId:id}, [{n:"fertId",l:"肥料の種類",t:"select",o:[["","指定なし"], ...S.ferts.map(f => [f.id, f.name])],v:lastLog(id,"fert")?.fertId||""}], "肥料を記録");
    else { S.logs.push({id:uid(), type:el.dataset.t, plantId:id, date:today(), value:"", note:"", photo:null, u:now()}); save(); render(); }
  }
  else if (a === "theme") { applyTheme(id); render(); }
  else if (a === "mem") openMem(id);
  else if (a === "selstart") { sel = new Set(); render(); }
  else if (a === "selcancel") { sel = null; render(); }
  else if (a === "selall") { sel = new Set(); S.plants.forEach(p => ["water","fert","repot"].forEach(t => { if (dueInfo(p, t)?.due) sel.add(p.id + ":" + t); })); render(); }
  else if (a === "seltoggle") { sel.has(id) ? sel.delete(id) : sel.add(id); render(); }
  else if (a === "selgo") {
    if (!sel || !sel.size) return;
    const keys = [...sel];
    if (S.ferts.length) openForm(`まとめて済にする（${keys.length}件）`, [{n:"date",l:"日付",t:"date",v:today()},{n:"fertId",l:"肥料の種類（使った場合。選んだ植物の肥料の記録にも残ります）",t:"select",o:[["","なし"], ...S.ferts.map(f => [f.id, f.name])],v:""}], o => batchDone(keys, o));
    else { batchDone(keys, {date: today(), fertId: ""}); save(); render(); }
  }
  else if (a === "placeadd") placeForm();
  else if (a === "placeedit") placeForm(placeById(id));
  else if (a === "specadd") specForm();
  else if (a === "specedit") specForm(S.specs.find(s => s.id === id));
  else if (a === "delspec") { if (confirm("この品種を削除しますか？（植物の品種名は残ります）")) { tomb([id]); S.specs = S.specs.filter(s => s.id !== id); save(); render(); } }
  else if (a === "fertadd") fertForm();
  else if (a === "fertedit") fertForm(fertById(id));
  else if (a === "delfert") { if (confirm("この肥料の種類を削除しますか？（過去の記録は残ります）")) { tomb([id]); S.ferts = S.ferts.filter(f => f.id !== id); save(); render(); } }
  else if (a === "dellog") { if (confirm("この記録を削除しますか？")) { tomb([id]); S.logs = S.logs.filter(l => l.id !== id); save(); render(); } }
  else if (a === "delplant") { if (confirm("植物と記録を削除しますか？")) { tomb([id, ...S.logs.filter(l => l.plantId === id).map(l => l.id)]); S.plants = S.plants.filter(p => p.id !== id); S.logs = S.logs.filter(l => l.plantId !== id); view = null; save(); render(); } }
  else if (a === "delplace") { if (confirm("置き場所を削除しますか？（記録も削除されます）")) { tomb([id, ...S.logs.filter(l => l.placeId === id).map(l => l.id)]); S.places = S.places.filter(p => p.id !== id); S.plants.forEach(p => { if (p.placeId === id) { p.placeId = ""; touch(p); } }); S.logs = S.logs.filter(l => l.placeId !== id); view = null; save(); render(); } }
  else if (a === "export") {
    const a2 = document.createElement("a"); a2.href = URL.createObjectURL(new Blob([JSON.stringify(S)], {type:"application/json"}));
    a2.download = "plant_care_backup_" + today() + ".json"; a2.click();
  } else if (a === "sync") syncNow(true);
  else if (a === "syncswitch") syncNow(true, true);
  else if (a === "import") {
    const i = document.createElement("input"); i.type = "file"; i.accept = ".json,application/json";
    i.onchange = async () => { try { const d = JSON.parse(await i.files[0].text()); if (!Array.isArray(d.plants) || !Array.isArray(d.places) || !Array.isArray(d.logs)) throw 0;
      if (confirm("現在のデータを置き換えて読み込みますか？")) { normalize(d); ["plants","places","logs","ferts","mems","specs"].forEach(k => d[k].forEach(touch)); S = d; save(); render(); } } catch { alert("読み込めないファイルです"); } };
    i.click();
  }
});
$("#back").onclick = () => { view = null; render(); };
$("#edit").onclick = () => view.k === "plant" ? plantForm(plantById(view.id)) : placeForm(placeById(view.id));
$("#fab").onclick = () => tab === "memory" ? memForm() : plantForm();

// ---------- Googleドライブ同期（appDataFolder。サーバー不要） ----------
// OAuthクライアントID（ウェブ）。公開されても問題ない種類の値。空のあいだは同期機能は使えない。
const GOOGLE_CLIENT_ID = "218853536367-1krvvs2koi9q2av5hrld2ndcll43latp.apps.googleusercontent.com";
const FILE_NAME = "plant_care.json", API = "https://www.googleapis.com";
let token = null, tokenExp = 0, tokenClient = null, syncing = false, syncAgain = false, syncMsg = "", syncTimer = null;
const lsGet = k => { try { return localStorage.getItem(k); } catch { return null; } };
function syncStatus(){
  const t = lsGet("plant_sync_last");
  return syncMsg || (t ? "最終同期：" + new Date(+t).toLocaleString("ja-JP") : "まだ同期していません");
}
function setSyncMsg(m){ syncMsg = m; const el = $("#syncst"); if (el) el.textContent = syncStatus(); }

function loadGis(){
  return new Promise((ok, ng) => {
    if (window.google?.accounts?.oauth2) return ok();
    const s = document.createElement("script"); s.src = "https://accounts.google.com/gsi/client";
    s.onload = ok; s.onerror = () => ng(new Error("Googleに接続できません（オフライン？）")); document.head.appendChild(s);
  });
}
// interactive=true: 画面操作から呼ばれたときだけログイン画面を出す
// pick=true: アカウント選択画面を必ず出す（別のGoogleアカウントへ切り替え）
// ホーム画面アプリ(iPhone)は小窓が開けないため、画面ごとGoogleのログインへ移って戻る方式を使う
const STANDALONE = !!navigator.standalone || matchMedia("(display-mode: standalone)").matches;
const REDIRECT_URI = "https://marushikakubesu-arch.github.io/plant_care_app/";
function takeRedirectToken(){
  const h = new URLSearchParams(location.hash.slice(1));
  if (!h.has("access_token") && !h.has("error")) return false;
  history.replaceState(null, "", location.pathname + location.search);
  if (h.get("error")) { syncMsg = "連携できませんでした：" + h.get("error"); return false; }
  if (!h.get("state") || h.get("state") !== lsGet("plant_oauth_state")) { syncMsg = "連携の確認に失敗しました。もう一度お試しください"; return false; }
  token = h.get("access_token"); tokenExp = now() + (+h.get("expires_in") || 3600) * 1000;
  try { localStorage.removeItem("plant_oauth_state"); } catch {}
  return true;
}
async function getToken(interactive, pick){
  if (!pick && token && now() < tokenExp - 60000) return token;
  if (STANDALONE) {
    if (!interactive) throw new Error("同期ボタンを押してください");
    const st = [...crypto.getRandomValues(new Uint8Array(16))].map(b => b.toString(16).padStart(2, "0")).join("");
    try { localStorage.setItem("plant_oauth_state", st); } catch {}
    location.href = "https://accounts.google.com/o/oauth2/v2/auth?" + new URLSearchParams({client_id: GOOGLE_CLIENT_ID, redirect_uri: REDIRECT_URI,
      response_type: "token", scope: "https://www.googleapis.com/auth/drive.appdata", state: st, ...(pick ? {prompt: "select_account"} : {})});
    return new Promise(() => {});
  }
  await loadGis();
  return new Promise((ok, ng) => {
    tokenClient = tokenClient || google.accounts.oauth2.initTokenClient({
      client_id: GOOGLE_CLIENT_ID, scope: "https://www.googleapis.com/auth/drive.appdata", callback: () => {}
    });
    tokenClient.callback = r => {
      if (r.error) return ng(new Error(r.error === "access_denied" ? "許可されませんでした" : "ログインが必要です"));
      token = r.access_token; tokenExp = now() + r.expires_in * 1000; ok(token);
    };
    tokenClient.error_callback = () => ng(new Error("ログインが必要です（同期ボタンを押してください）"));
    tokenClient.requestAccessToken({prompt: pick ? "select_account" : interactive ? "" : "none"});
  });
}
async function gfetch(url, opt){
  const r = await fetch(API + url, {...opt, headers: {Authorization: "Bearer " + token, ...(opt?.headers||{})}});
  if (!r.ok) throw new Error("Googleドライブとの通信に失敗しました(" + r.status + ")");
  return r;
}
// 新しい更新日時を採用して統合。削除の印のほうが新しければ削除を優先。
function mergeState(a, b){
  const del = new Map();
  [...a.del, ...b.del].forEach(d => { if (!del.has(d.id) || del.get(d.id) < d.u) del.set(d.id, d.u); });
  const out = {del: [...del].map(([id, u]) => ({id, u}))};
  ["plants","places","logs","ferts","mems","specs"].forEach(k => {
    const m = new Map();
    [...a[k], ...b[k]].forEach(o => { const c = m.get(o.id); if (!c || o.u > c.u) m.set(o.id, o); });
    out[k] = [...m.values()].filter(o => !(del.has(o.id) && del.get(o.id) >= o.u));
  });
  return out;
}
async function syncNow(interactive, pick){
  if (!GOOGLE_CLIENT_ID) return;
  if (syncing) { syncAgain = true; return; }
  syncing = true; setSyncMsg("同期中…");
  try {
    await getToken(interactive, pick);
    const q = encodeURIComponent(`name='${FILE_NAME}'`);
    const files = (await (await gfetch(`/drive/v3/files?spaces=appDataFolder&q=${q}&fields=files(id)`)).json()).files;
    let id = files[0]?.id, remote = null;
    if (id) { const d = await (await gfetch(`/drive/v3/files/${id}?alt=media`)).json(); if (Array.isArray(d.plants) && Array.isArray(d.places) && Array.isArray(d.logs)) remote = normalize(d); }
    S = remote ? mergeState(normalize(S), remote) : S;
    saveLocal();
    const body = JSON.stringify(S);
    if (id) await gfetch(`/upload/drive/v3/files/${id}?uploadType=media`, {method: "PATCH", headers: {"Content-Type": "application/json"}, body});
    else {
      const bd = "plant" + uid(), meta = JSON.stringify({name: FILE_NAME, parents: ["appDataFolder"]});
      await gfetch(`/upload/drive/v3/files?uploadType=multipart`, {method: "POST", headers: {"Content-Type": "multipart/related; boundary=" + bd},
        body: `--${bd}\r\nContent-Type: application/json\r\n\r\n${meta}\r\n--${bd}\r\nContent-Type: application/json\r\n\r\n${body}\r\n--${bd}--`});
    }
    try { localStorage.setItem("plant_sync_on", "1"); localStorage.setItem("plant_sync_last", String(now())); } catch {}
    syncMsg = ""; render();
  } catch (e) {
    token = null; setSyncMsg("同期できませんでした：" + e.message);
  }
  syncing = false;
  if (syncAgain) { syncAgain = false; scheduleSync(); }
}
function scheduleSync(){
  if (!GOOGLE_CLIENT_ID || !lsGet("plant_sync_on")) return;
  clearTimeout(syncTimer); syncTimer = setTimeout(() => syncNow(false), 3000);
}

// ---------- 起動 ----------
function start(){ dbGet().then(d => {
  if (d) S = normalize(d);
  const back = takeRedirectToken(); if (back || syncMsg) tab = "settings";
  render(); if (back) syncNow(false); else scheduleSync();
}); }
dbReq.onsuccess = start;
if ("serviceWorker" in navigator && location.protocol !== "file:") navigator.serviceWorker.register("sw.js");
</script>
